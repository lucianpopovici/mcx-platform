name: ci

# PLT-VER-002: both profile suites run on every change, against the same
# built artefact. Nothing here is conditional, allowed to fail, or skippable
# by branch or label — a suite that can be skipped is not evidence.

on: [push, pull_request]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest cryptography lxml
      - name: Boundary gate (TS-BND)
        run: python3 tools/check_boundary.py --root .

  unit:
    runs-on: ubuntu-latest
    needs: boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest cryptography lxml
      - name: Unit and integration suites
        run: python3 -m pytest tests/ -q

  conformance:
    runs-on: ubuntu-latest
    needs: boundary
    strategy:
      fail-fast: false
      matrix:
        profile: [mcx, frmcs, utility]
        release: [17, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest cryptography lxml
      # PLT-REL-007: profile and release are independent axes, so they are
      # tested as a matrix, not as a list. An untested combination is a
      # deployment nobody has ever run.
      - name: Conformance — ${{ matrix.profile }} at Rel-${{ matrix.release }}
        env:
          MCX_PROFILE: ${{ matrix.profile }}
          MCX_RELEASE: ${{ matrix.release }}
        run: python3 -m pytest tests/test_conformance.py -q

  release-gate:
    runs-on: ubuntu-latest
    needs: boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest cryptography lxml
      - name: Release gating across all eight published releases
        run: python3 -m pytest tests/test_release.py -q
