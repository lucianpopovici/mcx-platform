# overlay.yaml — hand-written annotations the repository cannot hold.
#
# Keyed by an id that exists in registry/ (OP, CA or VP1 id). `kb.py check` fails on
# an id nothing defines. Keep entries to things an agent needs and the docs don't say:
# who decides, a known trap, or a link across documents. Status stays in the repo.
#
# Fields (all optional): owner, note, trap, see.
#   owner: who resolves it — "lucian" (product/owner call), "agent" (implementation),
#          "3gpp-ct1" / "uic" (external body; the platform only records it)

VP1-BND-006:
  note: >-
    Decided 2026-09-25 (decisions/0002): one release image per profile, core hash identical
    across images. Built by tools/package.py; never add a per-profile build file.
  see: [decisions/0002-deployment-images.md]
PRF-OP-01:
  owner: lucian
  note: Profile-owner call. TS 24.379 cannot distinguish two pairs of call types; do not invent a signature.
OP-06:
  owner: lucian
  note: Decided 2026-09-25 with VP-OP-03 and MED-OP-01 (decisions/0011).
  see: [VP-OP-03, MED-OP-01, decisions/0011-codec-set-one-codec-per-call.md]
VP-OP-05:
  owner: lucian
  note: >-
    The production indicator. Three requirements (PLT-GEN-005, PLT-IDM-007, PLT-SEC-008) depend on it.
    2026-09-26: kept open in R1 with options A/B/C written into the VP; the owner has not chosen.
  trap: >-
    Making MCX_ENV required does not stop the administrator who configures the stubs from switching it;
    do not present option A as closing the risk, only the forgotten-variable case.
FRMCS-OP-01:
  owner: uic
  note: >-
    The FRMCS profile is a STUB with placeholder values, not reconciled with the UIC FRS/SRS.
    Never use it as safety-case input.
SHUNT-OP-01:
  owner: uic
FC-OP-10:
  owner: 3gpp-ct1
IWF-OP-01:
  owner: 3gpp-ct1
SIP-OP-12:
  note: Travels with the VP1-SIG-001 verdict (decisions/0005). Any claim that SIG-001 passed must carry it.
ICD-OP-12:
  owner: lucian
  note: Must be settled before any deployment on a network with a two-digit MNC.
