# FRMCS profile — STUB, NOT VALIDATED AGAINST UIC FRS/SRS
#
# Shape only: it exists to prove the hook boundary holds, and to give the
# conformance harness a second suite. Every value below is a placeholder.
# Before this goes anywhere near a real deployment it must be reconciled
# with the UIC FRMCS FRS/SRS and 3GPP TS 22.289, and the priority and QoS
# tables signed off under the CENELEC assurance process.
#
# What this file is meant to demonstrate: adding FRMCS touches ZERO files
# under core/. If implementing it requires a core change, the seam is in
# the wrong place.

$schema: "https://mcx-platform.invalid/schema/profile/v1"

profile:
  name: frmcs
  version: 0.0.1-stub
  description: Railway FRMCS profile (placeholder values)
  hooks:
    identity_resolver: profiles.frmcs.hooks:FunctionalResolver
    priority_policy: profiles.frmcs.hooks:TablePriorityPolicy
    session_policy: profiles.frmcs.hooks:FRMCSSessionPolicy
    bearer_selector: profiles.frmcs.hooks:MultiBearerSelector
    interconnection_gateway: profiles.frmcs.hooks:PartnerGateway
    interworking_gateway: profiles.frmcs.hooks:GSMRGateway

urgencies:
  - {id: normal, label: Normal}
  - {id: operational, label: Operational}
  - {id: railway-emergency, label: Railway emergency}

preemption_scopes:
  - {id: railway, label: Railway operations}

applications:
  - {id: voice-operational, label: Operational voice, media: [voice], safety_relevant: false}
  - {id: rec, label: Railway emergency communication, media: [voice], safety_relevant: true}
  - {id: shunting, label: Shunting, media: [voice], safety_relevant: true}
  - {id: etcs, label: ETCS over IPcon, media: [data], safety_relevant: true}
  - {id: ato, label: ATO over IPcon, media: [data], safety_relevant: true}

# Every group call type below is an ad hoc group call (UIC FRMCS SRS 21.4.4
# lists ad hoc group procedures only, and no prearranged group call occurs
# anywhere in the SRS), and ad hoc group calls do not exist in
# TS 24.379 before Rel-18. At MCX_RELEASE=17 no client can request them:
# with MCX_STRICT_RELEASE=true this profile refuses to start there; with
# false it starts and reports rec-broadcast and shunting-group unreachable.
call_types:
  - id: rec-broadcast
    label: Railway emergency call
    # UIC FRMCS SRS 10.2.2.1: REC-Voice is an "MCPTT ad hoc group
    # communication for emergency group call". Ad hoc group calls exist
    # from Rel-18; emergency is <adhoc-emergency-ind> (TS 24.379 6.2.8.1.21).
    mc_signature: {session_type: adhoc, emergency: true}
    media: [voice]
    session_model: broadcast
    urgency: railway-emergency
    application: rec
    auto_answer: true
    acknowledgement_required: true
    recording_required: true
    initiator_roles: [train-driver, track-controller]
    floor:
      initial_grant_to_initiator: true
      queueing_enabled: false
      override_allowed: true
      max_queue_depth: 0
      timers_ms: {T2: 1000, T20: 100, T8: 1000, T3: 3000}

  - id: shunting-group
    label: Shunting group call
    # SRS 21.4.4 lists only ad hoc group procedures (communication and
    # emergency alert); no prearranged group call occurs anywhere in the SRS. Shunting itself is not covered by the SRS (SHUNT-OP-01).
    mc_signature: {session_type: adhoc}
    media: [voice]
    session_model: on-demand
    urgency: operational
    application: shunting
    auto_answer: true
    acknowledgement_required: false
    recording_required: true
    max_participants: 30
    initiator_roles: [shunting-team-leader]
    floor:
      initial_grant_to_initiator: true
      queueing_enabled: true
      override_allowed: true
      max_queue_depth: 4
      timers_ms: {T2: 3000, T20: 100, T8: 1000, T3: 3000}

  - id: driver-controller
    label: Driver to controller call
    # SRS 21.4.4: private call.
    mc_signature: {session_type: private}
    media: [voice]
    session_model: on-demand
    urgency: operational
    application: voice-operational
    auto_answer: false
    acknowledgement_required: false
    recording_required: true
    max_participants: 2
    initiator_roles: [train-driver, track-controller]
    floor:
      initial_grant_to_initiator: true
      queueing_enabled: true
      override_allowed: false
      max_queue_depth: 2
      timers_ms: {T2: 4000, T20: 100, T8: 1000, T3: 3000}

  - id: etcs-ipcon
    label: ETCS data session
    # MCData IP connectivity (SRS 21.4.4), not an MCPTT session.
    mc_signature: null
    media: [data]
    session_model: pre-established
    urgency: operational
    application: etcs
    auto_answer: true
    acknowledgement_required: false
    recording_required: true
    initiator_roles: []
    floor:
      initial_grant_to_initiator: false
      queueing_enabled: false
      override_allowed: false
      max_queue_depth: 0
      timers_ms: {}

identity:
  domains: ["frmcs.example"]
  functional:
    - id: train-driver
      label: Driver of a train
      binding: dynamic
      location_dependent: false
      multiplicity: single
      resolves_to: user
    - id: track-controller
      label: Controller for a track section
      binding: dynamic
      location_dependent: true
      location_key: track_section
      multiplicity: single
      resolves_to: user
    - id: shunting-team-leader
      label: Shunting team leader
      binding: dynamic
      location_dependent: true
      location_key: yard_id
      multiplicity: single
      resolves_to: user
    - id: rec-area
      label: Emergency broadcast area
      binding: dynamic
      location_dependent: true
      location_key: track_section
      multiplicity: multi
      resolves_to: group

priority:
  default_scope: railway
  rules:
    - match: {call_type: "*", application: rec, urgency: "*"}
      decision:
        level: 95
        scope: railway
        preemption_capability: true
        preemption_vulnerability: false
        floor_priority: 255
        label: railway-emergency
    - match: {call_type: "*", application: etcs, urgency: "*"}
      decision:
        level: 85
        scope: railway
        preemption_capability: true
        # Band C, so a band-A railway emergency call must be able to take its
        # resources: FRS appendix J, "a FRMCS application with a higher
        # priority can take over resources from lower priority FRMCS
        # applications". This was false, which made an ETCS session
        # un-preemptable by anything, including a REC (PLT-CONF-AUDIT CA-19).
        preemption_vulnerability: true
        floor_priority: 240
        label: etcs-data
    # FRS appendix J, table J-1: "The ordering of priorities is according to
    # the row's." ATO (FRS 11.5) sits BELOW shunting (10.8) in that table, and
    # the appendix's own worked example is a REC pre-empting an active ATO
    # communication. This profile had ATO at 80 and shunting at 60 -- inverted,
    # so under congestion it would have pre-empted a shunting call to make room
    # for automatic train operation data (PLT-CONF-AUDIT CA-17).
    - match: {call_type: "*", application: ato, urgency: "*"}
      decision:
        level: 60
        scope: railway
        preemption_capability: true
        # The appendix's worked example, verbatim: "When there is an active ATO
        # communication and a REC-voice is initiated and there is congestion on
        # the transportlayer of FRMCS, the REC-voice communication pre-empts the
        # ATO communication." With this false, nothing could pre-empt an ATO
        # session at all -- the one case the FRS spells out (CA-19).
        preemption_vulnerability: true
        # Band E sits below D, so its floor priority must too. CA-17 corrected
        # `level` and left this behind: the ordering is carried by three fields
        # and only one of them was fixed.
        floor_priority: 180
        label: ato-data
    - match: {call_type: "*", application: shunting, urgency: "*"}
      decision:
        level: 80
        scope: railway
        # Band D is above E, F and G, so it may take their resources.
        preemption_capability: true
        preemption_vulnerability: true
        floor_priority: 230
        label: shunting
    # FRS 10.3 and 10.4 -- on-train voice to and from the controller -- are in
    # band D, alongside shunting. This application had no rule of its own and
    # fell through to the catch-all at level 30, which put driver-to-controller
    # voice BELOW automatic train operation data. That was FRMCS-OP-02, and
    # table J-1's band membership is what closes it.
    - match: {call_type: "*", application: voice-operational, urgency: "*"}
      decision:
        level: 80
        scope: railway
        preemption_capability: true
        preemption_vulnerability: true
        floor_priority: 230
        label: voice-controller
    - match: {call_type: "*", application: "*", urgency: "*"}
      decision:
        level: 30
        scope: railway
        preemption_capability: false
        preemption_vulnerability: true
        floor_priority: 100
        label: operational

bearer:
  rules:
    # SRS Annex A table A.1-1: Emergency Voice (6) is 5QI 65 (GBR), ARP 2.
    # This was ARP 1, which the same table reserves for FRMCS Signalling (4) --
    # the FRMCS-internal signalling for MCX and 5G. A railway emergency call is
    # the highest USER-PLANE priority, not the highest priority full stop, and
    # claiming ARP 1 for it would have out-ranked the signalling that sets the
    # call up (PLT-CONF-AUDIT CA-18).
    - match: {call_type: rec-broadcast, media: voice}
      decision:
        qos_identifier: 65
        arp_level: 2
        arp_preemption_capability: true
        arp_preemption_vulnerability: false
        redundancy: multihomed
        paths:
          - {id: bearer-a, transport: udp, primary: true, weight: 2, attributes: {}}
          - {id: bearer-b, transport: udp, primary: false, weight: 1, attributes: {}}
    # ETCS is "ATP Regular Data" in FRMCS SRS Annex A note (11): ETCS on-board
    # to ETCS trackside. Annex A assigns it 5QI 4, GBR (PLT-CONF-AUDIT CA-16).
    #
    # TS 23.501 calls 5QI 4 "Non-Conversational Video (Buffered Streaming)",
    # which reads oddly for train control until you look at what was actually
    # being selected: 4 is GBR with priority level 50, and Annex A.3 derives
    # the ETCS requirement from Subset-093's 2.6 s transaction transfer delay.
    # The Example Services column of table 5.7.4-1 describes a traffic class
    # for the general-purpose 5QIs; it only names a service for the
    # mission-critical ones. A guaranteed bit rate was the requirement.
    # ...and ARP 4, not the 2 this carried. Table A.1-1 puts ATP Regular Data
    # between Emergency Voice (2) and the Voice band (3-8), which is what
    # "control-command (safety) priority" sitting below the railway emergency
    # call looks like in numbers.
    - match: {call_type: etcs-ipcon, media: data}
      decision:
        qos_identifier: 4
        arp_level: 4
        arp_preemption_capability: true
        arp_preemption_vulnerability: false
        redundancy: multihomed
        paths:
          - {id: bearer-a, transport: sctp, primary: true, weight: 2, attributes: {multihoming: "true"}}
          - {id: bearer-b, transport: sctp, primary: false, weight: 1, attributes: {multihoming: "true"}}
    # FRS 10.3/10.4 -- on-train voice to and from the controller. SRS Annex A
    # note (7) gives the ARP per application directly: "Voice" includes
    # 10.18-10.19 (ARP=3), 10.3-10.6 (ARP=5), 10.10+10.23 (ARP=6), 10.2
    # (ARP=8). A driver-to-controller call is 10.3/10.4, so ARP 5 -- it was
    # falling through to the catch-all at 6, which the note reserves for
    # ground-to-ground and public address (PLT-CONF-AUDIT CA-17).
    # Pre-emption capability stays false: this call type resolves to the
    # `operational` priority decision, which does not authorise it, and the
    # platform refuses a bearer rule that asks for more than its priority
    # decision grants. That refusal is correct and it exposes a real gap --
    # FRS table J-1 puts 10.3/10.4 in a band above ATO, while this profile's
    # single `voice-operational` application drops them into the catch-all.
    # See FRMCS-OP-02.
    - match: {call_type: driver-controller, media: voice}
      decision:
        qos_identifier: 65
        arp_level: 5
        arp_preemption_capability: false
        arp_preemption_vulnerability: true
        redundancy: multipath
        paths:
          - {id: bearer-a, transport: udp, primary: true, weight: 2, attributes: {}}
          - {id: bearer-b, transport: udp, primary: false, weight: 1, attributes: {}}
    # The catch-all keeps ARP 6, which note (7) assigns to 10.10 (ground to
    # ground) and 10.23 (public address). Shunting voice (10.8) also lands
    # here, and should not: see SHUNT-OP-01 -- SRS Annex A note (1) lists 10.8
    # among the FRS applications "not yet covered", so it has no assignment to
    # transcribe and none is invented.
    - match: {call_type: "*", media: voice}
      decision:
        qos_identifier: 65
        arp_level: 6
        arp_preemption_capability: false
        arp_preemption_vulnerability: true
        redundancy: multipath
        paths:
          - {id: bearer-a, transport: udp, primary: true, weight: 2, attributes: {}}
          - {id: bearer-b, transport: udp, primary: false, weight: 1, attributes: {}}
    # Annex A assigns 5QI 8 to General Data (9), Urgent Data (8), TCMS (10),
    # ATP Compl. Data (12) and ATO (13) alike -- every data session that is
    # not ATP Regular Data. This was 70 (Mission Critical Data), which clause
    # 14.6.2.2 makes optional and which Annex A does not assign to anything.
    #
    # FRMCS SRS clause 14.6.5.3: "The FRMCS system shall apply the ARP values
    # 1 to 8" (M), with Note 1 recording that 9-15 are a national matter. The
    # ARP was 9, legal in TS 23.501 (the range is 1-15) but outside what an
    # FRMCS deployment may portably assume.
    - match: {call_type: "*", media: data}
      decision:
        qos_identifier: 8
        arp_level: 8
        arp_preemption_capability: false
        arp_preemption_vulnerability: true
        redundancy: single
        paths:
          - {id: bearer-a, transport: tcp, primary: true, weight: 1, attributes: {}}

interworking:
  system: gsm-r
  gateway: "sip:gsmr-gw@frmcs.example"
  routes:
    - match: {target_prefix: "gsmr:"}
      gateway: "sip:gsmr-gw@frmcs.example"
      attributes: {}

# Interconnection with partner MC systems (IF-ICX). Provisional, like the rest
# of this stub. Note the asymmetry with the partner's own file: each operator
# declares what the OTHER may do here, and the two need not agree.
interconnection:
  partners:
    - id: public-safety-operator
      domains: ["mcptt.example"]
      target_prefix: "icx:ps:"
      gateway: "sip:icx@mcptt.example"
      trust: mutual-tls
      inbound:
        scope: railway
        # Well below the railway-emergency level (95): a non-railway system
        # must never be able to outrank railway emergency traffic.
        max_level: 45
        may_preempt: false
        allowed_call_types: [driver-controller]
        priority_map:
          - {from_label: emergency, to_level: 45, to_label: partner-urgent}
          - {from_label: imminent-peril, to_level: 35, to_label: partner-elevated}
          - {from_label: normal, to_level: 15, to_label: partner-routine}
          - {from_label: normal-private, to_level: 15, to_label: partner-routine}
      outbound:
        assert_label: true

admission:
  max_concurrent_sessions: 5000
  reserved_for_urgency:
    railway-emergency: 500
    operational: 1000
  reject_reason_codes:
    - capacity-exhausted
    - not-authorised
    - unknown-functional-identity
    - no-location-binding
    - call-type-not-permitted

# Voice codecs the deployment may carry (PLT-MED-001). PROVISIONAL: the codec
# set per profile is an open point (PLT-SRS OP-06, VP-OP-03) and these values
# are placeholders, not a confirmed selection.
media:
  codecs:
    - {payload_type: 97, name: "AMR-WB/16000"}
    - {payload_type: 0, name: "PCMU/8000"}
